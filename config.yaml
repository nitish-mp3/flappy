---
name: Flappy
slug: flappy
description: >
  KNX/IP failover with ordered IP/USB interfaces, monitoring and discovery.
  Configure everything through Open Web UI. Existing settings are imported.
version: "4.4.1"
homeassistant: "2024.1.0"
arch:
  - aarch64
  - amd64
startup: services
boot: auto

# ─── Web UI (HA Ingress) ─────────────────────────────────────────────
ingress: true
ingress_port: 8099
panel_icon: mdi:lan-connect
panel_title: KNX Failover

# ─── Network ──────────────────────────────────────────────────────────
# host_network is REQUIRED — KNX gateways use UDP unicast/multicast
# on the physical LAN; Docker bridge networking blocks these replies.
host_network: true
ports:
  3671/tcp: 3671
  3671/udp: 3671

# ─── Defaults ─────────────────────────────────────────────────────────
options:
  # Frontend (what HA connects to)
  frontend_protocol: udp
  listen_port: 3671

  # Primary interface
  primary_host: ""
  primary_port: 3671
  primary_protocol: tcp
  primary_secure: false
  primary_device_password: ""
  primary_user_password: ""
  primary_user_id: 1

  # Backup interface
  backup_host: ""
  backup_port: 3671
  backup_protocol: udp
  backup_secure: false
  backup_device_password: ""
  backup_user_password: ""
  backup_user_id: 1

  # USB interface (local knxd or native)
  usb_device: ""
  usb_baud: 19200
  usb_priority: last_resort
  usb_mode: auto
  usb_knxd_extra_args: ""

  # External knxd addon (third failover tier)
  knxd_host: ""
  knxd_port: 3671
  knxd_protocol: udp

  # Health checking
  health_check_interval: 1
  health_check_fall: 2
  health_check_rise: 2
  health_check_method: probe
  connection_timeout: 1

  # Failover / failback
  failback_mode: auto
  failback_delay_seconds: 30

  # Sessions
  max_sessions: 8
  session_timeout: 120
  drain_timeout_seconds: 5

  # Logging & notifications
  log_level: info
  notify_on_failover: false

# All configuration is managed in the ingress Web UI. Existing Supervisor
# options above are retained only as migration defaults for older installations.
schema: false

# ─── Permissions ──────────────────────────────────────────────────────
privileged: []
hassio_api: true
auth_api: false
uart: true
udev: true
usb: true
devices: []
realtime: false
init: false
services: []